services:
  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: ${CLIENT_CONTAINER_NAME:-react-client-dev}
    restart: unless-stopped
    env_file:
      - .env.development
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://api-nginx:80}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_APP_NAME: ${VITE_APP_NAME:-React Client}
      APP_SOURCE_DIR: ${APP_SOURCE_DIR:-src/app}
    ports:
      - "${CLIENT_DEV_PORT:-5173}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - app-network
      - api-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: npm run dev -- --host 0.0.0.0

networks:
  app-network:
    external: true
    name: ${APP_NETWORK:-app-network}
  api-network:
    external: true
    name: ${API_NETWORK:-api-network}

