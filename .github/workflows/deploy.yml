name: Validate Client Skeleton

on:
  push:
    branches:
      - master
      - main
      - "upgrade/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint reusable TypeScript
        run: npm run lint

      - name: Build standard extension fixture
        run: npm run test:contract:legacy

      - name: Build generic production image
        run: |
          docker build \
            --build-arg APP_SOURCE_DIR=fixtures/legacy-app \
            --build-arg VITE_APP_NAME="React Client" \
            --build-arg VITE_API_BASE_URL=/api \
            -f docker/Dockerfile \
            .
