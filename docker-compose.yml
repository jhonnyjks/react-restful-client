services:
  client:
    image: ${CLIENT_IMAGE:-react-client}:${CLIENT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_APP_NAME: ${VITE_APP_NAME:-React Client}
        APP_SOURCE_DIR: ${APP_SOURCE_DIR:-src/app}
    deploy:
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.${TRAEFIK_ROUTER:-react-client}.rule=Host(`${CLIENT_HOST:-localhost}`)"
        - "traefik.http.routers.${TRAEFIK_ROUTER:-react-client}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
        - "traefik.http.routers.${TRAEFIK_ROUTER:-react-client}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencryptresolver}"
        - "traefik.http.services.${TRAEFIK_ROUTER:-react-client}.loadbalancer.server.port=80"
    ports:
      - target: 80
        published: ${CLIENT_PORT:-3000}
        protocol: tcp
        mode: ingress
    environment:
      API_BACKEND: ${API_BACKEND:-http://api-nginx:80}
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
    networks:
      - app-network
      - api-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  app-network:
    external: true
    name: ${APP_NETWORK:-app-network}
  api-network:
    external: true
    name: ${API_NETWORK:-api-network}

