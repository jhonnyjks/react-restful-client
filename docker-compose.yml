services:
  client:
    image: ${CLIENT_IMAGE:-react-client}:${CLIENT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_APP_NAME: ${VITE_APP_NAME:-React Client}
        APP_SOURCE_DIR: ${APP_SOURCE_DIR:-src/app}
    restart: unless-stopped
    # Container labels support ordinary Docker Compose; deploy.labels below
    # retain the same routing when this file is deployed as a Swarm stack.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-Diatech}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-alia-admin}.rule=Host(`${CLIENT_HOST:?CLIENT_HOST is required}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-alia-admin}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-alia-admin}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencryptresolver}"
      - "traefik.http.services.${TRAEFIK_ROUTER:-alia-admin}.loadbalancer.server.port=80"
    deploy:
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=${TRAEFIK_NETWORK:-Diatech}"
        - "traefik.http.routers.${TRAEFIK_ROUTER:-alia-admin}.rule=Host(`${CLIENT_HOST:?CLIENT_HOST is required}`)"
        - "traefik.http.routers.${TRAEFIK_ROUTER:-alia-admin}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
        - "traefik.http.routers.${TRAEFIK_ROUTER:-alia-admin}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencryptresolver}"
        - "traefik.http.services.${TRAEFIK_ROUTER:-alia-admin}.loadbalancer.server.port=80"
    # Production is served only by Traefik/TLS. docker-compose.dev.yml
    # publishes Vite on port 5173 for a local browser.
    environment:
      API_BACKEND: ${API_BACKEND:?API_BACKEND is required}
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:?NGINX_SERVER_NAME is required}
    networks:
      - app-network
      - api-network
networks:
  app-network:
    external: true
    name: ${APP_NETWORK:-Diatech}
  api-network:
    external: true
    name: ${API_NETWORK:-alia-internal}

